# File: .github/workflows/deploy.yml
name: deploy
on:
  push:
    tags: ["v*"]

jobs:
  push-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Push images
        run: |
          docker build -f deployment/docker/Dockerfile.api -t ghcr.io/${{ github.repository }}/api:${{ github.ref_name }} .
          docker push ghcr.io/${{ github.repository }}/api:${{ github.ref_name }}
      - name: Deploy to production
        run: echo "Add your kubectl apply / ssh deploy step here"