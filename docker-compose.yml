# File: docker-compose.yml
version: "3.9"

services:
  db:
    build:
      context: .
      dockerfile: deployment/docker/Dockerfile.database
    environment:
      POSTGRES_DB: predictmaint
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d predictmaint"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: deployment/docker/Dockerfile.api
    environment:
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: predictmaint
      DB_USER: postgres
      DB_PASSWORD: ${DB_PASSWORD:-postgres}
      API_TOKEN: ${API_TOKEN:-devtoken}
      R_CONFIG_ACTIVE: default
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"

  shiny:
    build:
      context: .
      dockerfile: deployment/docker/Dockerfile.shiny
    environment:
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: predictmaint
      DB_USER: postgres
      DB_PASSWORD: ${DB_PASSWORD:-postgres}
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "3838:3838"

  trainer:
    build:
      context: .
      dockerfile: Dockerfile
    profiles: ["train"]
    environment:
      DB_HOST: db
      DB_PASSWORD: ${DB_PASSWORD:-postgres}
    depends_on:
      db:
        condition: service_healthy
    command: ["Rscript", "-e", "targets::tar_make()"]

  nginx:
    image: nginx:1.25-alpine
    volumes:
      - ./deployment/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    ports:
      - "80:80"
    depends_on:
      - api
      - shiny

volumes:
  pgdata: